# ── Application ──────────────────────────────────────────────
spring.application.name=campus-connect-backend
server.port=${PORT:8888}

# ── DataSource ───────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
# use 'create' on very first run, then switch to 'update'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── File Upload ───────────────────────────────────────────────
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ── CORS ──────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Seeded admin account
app.seed.admin.email=admin@campusconnect.com
app.seed.admin.password=Admin@12345
app.seed.admin.full-name=System Administrator
app.seed.admin.code=ADMIN001
